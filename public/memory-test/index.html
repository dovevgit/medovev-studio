<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>משחק הזיכרון של הסטודיו</title>
<style>
/* ---------------------------------------------------------------------------
 * The studio's memory game.
 *
 * Eighteen cards, nine services. The back is the studio's own card; the face
 * is the same cloth with the service's emblem on it and its name below in
 * live text, so the names stay crisp at every size, read to a screen reader,
 * and can be changed without touching a picture.
 * ------------------------------------------------------------------------ */
:root {
  --bg: #0d0b09;
  --bg-lift: #17110c;
  --ink: #f1e8d6;
  --ink-soft: #a89a84;
  --gilt: #c9a042;
  --royal: #2f4b80;
  --royal-lit: #3f619f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: clamp(1.5rem, 4vw, 3.5rem) clamp(0.9rem, 3vw, 2rem) clamp(3rem, 6vw, 5rem);
  background:
    radial-gradient(120% 70% at 50% 0%, #1b1309 0%, transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: "Heebo", "Assistant", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 72rem; margin: 0 auto; }

.head { text-align: center; margin-bottom: clamp(1.2rem, 3vw, 2rem); }

.eyebrow {
  margin: 0 0 0.5rem;
  color: var(--gilt);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.16em;
}

h1 {
  margin: 0;
  font-size: clamp(1.5rem, 4.4vw, 2.6rem);
  font-weight: 700;
  line-height: 1.15;
}

.lede {
  margin: 0.7rem auto 0;
  max-width: 34rem;
  color: var(--ink-soft);
  font-size: clamp(0.92rem, 2.1vw, 1.08rem);
  line-height: 1.6;
}

/* The bar reads as one strip, so the two counters and the reset button do not
 * drift apart on a narrow screen. */
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.6rem 1.4rem;
  margin: 0 auto clamp(1.1rem, 2.6vw, 1.8rem);
  padding: 0.65rem 1.1rem;
  width: max-content;
  max-width: 100%;
  border: 1px solid rgba(201, 160, 66, 0.3);
  border-radius: 999px;
  background: rgba(23, 17, 12, 0.8);
  font-size: 0.92rem;
}

.bar b { color: var(--gilt); font-variant-numeric: tabular-nums; }

.reset {
  padding: 0.42rem 1.1rem;
  border: 1px solid rgba(241, 232, 214, 0.35);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.reset:hover,
.reset:focus-visible { background: var(--royal); border-color: var(--royal-lit); }

.grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: clamp(0.4rem, 1.3vw, 0.95rem);
}

.card {
  position: relative;
  aspect-ratio: 3 / 4;
  padding: 0;
  border: 0;
  border-radius: 5%;
  background: transparent;
  perspective: 900px;
  container-type: inline-size;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.card:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }

.inner {
  /* A span is inline by default, and an inline box ignores width and height:
   * left that way it measures 0x0, and the two absolutely positioned faces
   * resolve inset:0 against nothing and vanish. */
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.3, 1);
}

.card.flip .inner { transform: rotateY(180deg); }

/* A wrong pair shivers rather than flashing a colour: on this cloth a red
 * tint would read as part of the artwork. */
.card.bad .inner { animation: shake 0.4s ease; }

@keyframes shake {
  0%, 100% { transform: rotateY(180deg) translateX(0); }
  25% { transform: rotateY(180deg) translateX(-4%); }
  75% { transform: rotateY(180deg) translateX(4%); }
}

.card.done { cursor: default; }

.card.done .face-front {
  box-shadow: 0 0 0 1px rgba(201, 160, 66, 0.9), 0 0 1.6rem rgba(201, 160, 66, 0.4);
}

.face {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-position: center;
  background-size: cover;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.face-back { background-image: url("assets/card-back.webp"); }

.face-front {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3%;
  padding: 12% 13% 10%;
  background-image: url("assets/card-front.webp");
  transform: rotateY(180deg);
}

.face-front img {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0.4cqw 0.7cqw rgba(0, 0, 0, 0.5));
}

/* cqw, so the name scales with the card and not with the page: the grid goes
 * from six columns to three, and the type has to follow the card it sits on. */
.name {
  flex: 0 0 auto;
  color: #f6edd9;
  font-size: clamp(9px, 8.6cqw, 1.05rem);
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  text-shadow: 0 0.2cqw 0.6cqw rgba(6, 10, 24, 0.85);
}

.toast {
  min-height: 3.4rem;
  margin: clamp(1.1rem, 2.6vw, 1.7rem) auto 0;
  max-width: 40rem;
  color: var(--ink-soft);
  font-size: clamp(0.9rem, 2vw, 1.02rem);
  line-height: 1.6;
  text-align: center;
}

.toast b { display: block; color: var(--gilt); font-size: 1.1em; }
.toast a { color: var(--ink); text-underline-offset: 0.25em; }

.win {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 1.25rem;
  background: rgba(6, 5, 4, 0.82);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.4s ease, visibility 0.4s;
}

.win.on { opacity: 1; visibility: visible; }

.win-box {
  max-width: 30rem;
  padding: clamp(1.6rem, 4vw, 2.6rem);
  border: 1px solid rgba(201, 160, 66, 0.45);
  border-radius: 1.1rem;
  background: var(--bg-lift);
  text-align: center;
}

.win-box h2 { margin: 0 0 0.6rem; font-size: clamp(1.4rem, 4vw, 2rem); }
.win-box p { margin: 0 0 1.4rem; color: var(--ink-soft); line-height: 1.6; }

.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.7rem; }

.btn {
  padding: 0.7rem 1.5rem;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--gilt);
  color: #1c1409;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

.btn-out { background: transparent; border-color: rgba(241, 232, 214, 0.4); color: var(--ink); }

.confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; }

@media (max-width: 860px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  .inner { transition: none; }
  .card.bad .inner { animation: none; }
  .win { transition: none; }
}
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <p class="eyebrow">משחק קצר</p>
    <h1>משחק הזיכרון של הסטודיו</h1>
    <p class="lede">הפכו קלפים, מצאו זוגות וגלו כל מה שהסטודיו יכול לעשות עבורכם</p>
  </header>

  <div class="bar">
    <span>מהלכים: <b id="moves">0</b></span>
    <span>זוגות: <b id="pairs">0</b>/9</span>
    <button class="reset" id="reset" type="button">משחק חדש</button>
  </div>

  <div class="grid" id="grid"></div>

  <p aria-live="polite" class="toast" id="toast">לחצו על קלף כדי להתחיל</p>
</main>

<div aria-label="סיום המשחק" aria-modal="true" class="win" id="win" role="dialog">
  <div class="win-box">
    <h2>כל הכבוד</h2>
    <p>עכשיו אתם יודעים כל מה שאנחנו יכולים לעשות עבורכם</p>
    <div class="row">
      <a class="btn" href="https://wa.me/972545008001?text=%D7%A9%D7%9C%D7%95%D7%9D%2C%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%9E%D7%94%D7%90%D7%AA%D7%A8%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A9%D7%9E%D7%95%D7%A2%20%D7%A4%D7%A8%D7%98%D7%99%D7%9D." rel="noreferrer" target="_blank">דברו איתנו</a>
      <button class="btn btn-out" id="again" type="button">משחק חדש</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SERVICES = [
    { slug: "strategy",    name: "אסטרטגיה עסקית",     tag: "תוכנית פעולה אמיתית" },
    { slug: "digital",     name: "נוכחות דיגיטלית",    tag: "להיות בכל מקום ולדבר באותה שפה" },
    { slug: "web",         name: "נכסים דיגיטליים",    tag: "אתרים, אפליקציות ורשתות חברתיות" },
    { slug: "ai",          name: "פתרונות AI מתקדמים", tag: "צ'אטבוטים, סוכנים ואוטומציות" },
    { slug: "implementer", name: "מיישם AI",           tag: "הדרכה והטמעת תהליכים בארגון" },
    { slug: "video",       name: "הפקות וידאו",        tag: "מהקונספט ועד תוצר וידאו מושלם" },
    { slug: "photo",       name: "צילום",              tag: "נכסים, מוצרים ותדמית" },
    { slug: "podcast",     name: "פודקאסטים",          tag: "אפיון, הפקה וחיתוכים לסרטונים קצרים" },
    { slug: "voice",       name: "קריינות מקצועית",    tag: "הקריין המושמע ביותר בישראל" }
  ];

  var BASE = "https://medovev.com/services/";

  var grid = document.getElementById("grid");
  var toast = document.getElementById("toast");
  var win = document.getElementById("win");
  var movesOut = document.getElementById("moves");
  var pairsOut = document.getElementById("pairs");
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var first = null, lock = false, moves = 0, pairs = 0;

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = list[i]; list[i] = list[j]; list[j] = swap;
    }
    return list;
  }

  function build() {
    grid.textContent = "";
    first = null; lock = false; moves = 0; pairs = 0;
    movesOut.textContent = "0";
    pairsOut.textContent = "0";
    toast.textContent = "לחצו על קלף כדי להתחיל";
    win.classList.remove("on");

    shuffle(SERVICES.concat(SERVICES)).forEach(function (service, index) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.dataset.slug = service.slug;
      card.setAttribute("aria-label", "קלף " + (index + 1) + ", הפוך");

      var inner = document.createElement("span");
      inner.className = "inner";

      var back = document.createElement("span");
      back.className = "face face-back";

      var front = document.createElement("span");
      front.className = "face face-front";

      var art = document.createElement("img");
      art.src = "assets/logo-" + service.slug + ".webp";
      art.alt = "";
      art.loading = "lazy";

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = service.name;

      front.append(art, name);
      inner.append(back, front);
      card.append(inner);
      card.addEventListener("click", function () { pick(card); });
      grid.append(card);
    });
  }

  function pick(card) {
    if (lock || card.classList.contains("flip")) { return; }
    card.classList.add("flip");
    card.setAttribute("aria-label", nameOf(card.dataset.slug));

    if (!first) { first = card; return; }

    moves += 1;
    movesOut.textContent = String(moves);

    var a = first, b = card;
    first = null;

    if (a.dataset.slug === b.dataset.slug) {
      a.classList.add("done");
      b.classList.add("done");
      pairs += 1;
      pairsOut.textContent = String(pairs);
      say(a.dataset.slug);
      if (pairs === SERVICES.length) {
        setTimeout(function () { win.classList.add("on"); confetti(); }, 850);
      }
      return;
    }

    // Both cards stay up long enough to be read, and the board is locked
    // meanwhile -- without the lock a fast tapper can turn a third card and
    // leave two faces up with nothing holding them.
    lock = true;
    a.classList.add("bad");
    b.classList.add("bad");
    setTimeout(function () {
      [a, b].forEach(function (c) {
        c.classList.remove("flip", "bad");
        c.setAttribute("aria-label", "קלף, הפוך");
      });
      lock = false;
    }, 950);
  }

  function nameOf(slug) {
    return SERVICES.filter(function (s) { return s.slug === slug; })[0].name;
  }

  function say(slug) {
    var service = SERVICES.filter(function (s) { return s.slug === slug; })[0];
    toast.textContent = "";
    var strong = document.createElement("b");
    strong.textContent = service.name;
    var link = document.createElement("a");
    link.href = BASE + service.slug + "/";
    link.textContent = "לעמוד השירות";
    toast.append(strong, document.createTextNode(service.tag + " · "), link);
  }

  /* --- the confetti ------------------------------------------------------
   * Gold, royal blue and cream, the three colours the cards are painted in.
   * It runs on one canvas added on the first win and reused after that, and
   * it stops itself once the last piece is off the bottom -- there is no
   * animation frame left running behind the dialog.
   * --------------------------------------------------------------------- */
  var canvas = null, ctx = null, bits = [], frame = 0;
  var COLOURS = ["#c9a042", "#e8d49a", "#2f4b80", "#f1e8d6"];

  function confetti() {
    if (calm) { return; }
    if (!canvas) {
      canvas = document.createElement("canvas");
      canvas.className = "confetti";
      canvas.setAttribute("aria-hidden", "true");
      document.body.append(canvas);
      ctx = canvas.getContext("2d");
    }
    canvas.width = innerWidth;
    canvas.height = innerHeight;

    bits = [];
    for (var i = 0; i < 140; i++) {
      bits.push({
        x: Math.random() * canvas.width,
        y: -Math.random() * canvas.height * 0.5,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vy: 1.8 + Math.random() * 2.6,
        vx: -0.9 + Math.random() * 1.8,
        spin: -0.1 + Math.random() * 0.2,
        angle: Math.random() * Math.PI,
        colour: COLOURS[Math.floor(Math.random() * COLOURS.length)]
      });
    }

    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(tick);
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var alive = 0;

    bits.forEach(function (bit) {
      bit.x += bit.vx;
      bit.y += bit.vy;
      bit.angle += bit.spin;
      if (bit.y < canvas.height + 40) { alive += 1; }

      ctx.save();
      ctx.translate(bit.x, bit.y);
      ctx.rotate(bit.angle);
      ctx.fillStyle = bit.colour;
      ctx.fillRect(-bit.w / 2, -bit.h / 2, bit.w, bit.h);
      ctx.restore();
    });

    if (alive) {
      frame = requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  document.getElementById("reset").addEventListener("click", build);
  document.getElementById("again").addEventListener("click", build);
  win.addEventListener("click", function (event) {
    if (event.target === win) { win.classList.remove("on"); }
  });
  addEventListener("keydown", function (event) {
    if (event.key === "Escape") { win.classList.remove("on"); }
  });

  build();
})();
</script>
</body>
</html>
